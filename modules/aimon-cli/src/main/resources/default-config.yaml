# Aimon CLI Default Configuration

# LLM Provider Configuration
llm:
  provider: "openai"
  baseUrl: https://api.openai.com/v1
  apiKey: "${OPENAI_KEY}"
  model: "gpt-5.1"
  timeout: 60
# How hard the model should think. Read by BOTH providers -- the name is the framework's own neutral
# type and the question means the same thing to either vendor, which is why it is here and not under
# `anthropic` below. Commented out on purpose: an uncommented default would change every request this
# CLI makes. A per-agent `model.reasoningEffort` in an agent definition wins over it.
#
# On Anthropic it needs `anthropic.thinkingMode` to be something other than the default `off`, or the
# request carries no thinking parameter and the effort reaches nothing -- the client says so once.
#  reasoningEffort: medium                      # none | minimal | low | medium | high -- case-insensitive

# The built-in capability table knows models by their real names. An Azure deployment or an
# OpenAI-compatible gateway behind `baseUrl` may expose one under a name of its own, and that name
# falls through to the fail-open path -- so a model that rejects `temperature` gets it anyway, and
# answers HTTP 400. Name the deployment here to say what it really accepts. Both providers read this
# block; the key is the same name `model` above carries.
#
# Every flag is optional and each one is independent. For a name the built-in table does NOT describe
# -- a renamed gateway deployment, which is the case above -- what you leave out keeps today's
# behaviour, so the one-line form below is a complete answer to the 400. For a name the table DOES
# describe (`claude-sonnet-5`, `gpt-5-mini`), an entry REPLACES that row rather than patching it, so
# restate every flag that row stated: see the `claude-*` example at the bottom of this block.
# Values are case-insensitive.
#  modelCapabilities:
#    prod-assistant:
#      supportsSamplingParameters: false        # model rejects temperature / top_p / the penalties
#      supportsReasoningEffort: true            # model takes a reasoning-effort parameter
#      supportsToolsWithReasoning: true         # tools and a reasoning effort may be combined
#      supportsReasoningTraceRoundTrip: false   # true routes the model at /v1/responses -- leave false on a Chat-only gateway
#      supportsReasoningSummary: true           # false when the gateway takes reasoning.effort and 400s
#                                               #   on reasoning.summary (only read on /v1/responses)
#      thinkingDialect: adaptive                # unknown | either | budgeted | adaptive -- which thinking request
#                                               #   shape this model speaks. `llm.anthropic.thinkingMode: auto`
#                                               #   asks this. `unknown` says "act on no built-in row";
#                                               #   `either` says the model was measured to take both
#      lowestReasoningEffort: minimal           # none | minimal | low | medium | high -- the rung the
#                                               #   ladder starts at, with everything above it accepted
#      acceptedReasoningEfforts: [none, low, medium, high]
#                                               # the general form, for a ladder with a GAP in it (the
#                                               #   built-in gpt-5.6-terra row is one: it takes `none`
#                                               #   and rejects `minimal`). Mutually exclusive with
#                                               #   `lowestReasoningEffort` -- writing both fails startup.
#                                               #   An empty entry (`~`, or a bare `-`) fails startup too,
#                                               #   naming the position: it is a typo, not a rung to skip
#
# Describing a name the built-in table already carries -- the shape `thinkingMode: auto` sends you to
# when a gateway renames a Claude model. The entry is the whole row, so both flags are written: the
# built-in `claude-*` row states the dialect AND that these models reject temperature / top_p, and an
# entry naming only the first hands the second back as fail-open `true`, which is the 400 again.
#    claude-sonnet-5:
#      thinkingDialect: adaptive                # or `unknown` if you do not know it
#      supportsSamplingParameters: false        # restated from the built-in row -- not optional here

# Anthropic-only settings. Unlike `modelCapabilities` above, this block is read by the anthropic
# provider alone -- all four key names carry Anthropic's own vocabulary -- so writing it under
# `provider: openai` fails at startup rather than being ignored. Leave it out and the request is
# byte-for-byte what it was: mode OFF, no budget, no display, replay on.
#  anthropic:
#    thinkingMode: extended            # off (default) | extended | adaptive | auto -- case-insensitive
#                                      #   off      send no thinking parameter (the model may still think)
#                                      #   extended thinking: {"type": "enabled", "budget_tokens": N}
#                                      #   adaptive thinking: {"type": "adaptive"} + output_config.effort
#                                      #   auto     whichever dialect the capability table says this model
#                                      #            speaks; a model the table cannot name sends nothing and
#                                      #            warns -- declare it under `modelCapabilities` above
#                                      # `extended` here rather than `auto` so this block boots as written:
#                                      #   the budget line below is legal under that one mode only. Uncomment
#                                      #   `auto` instead and the budget line has to go with it.
#    thinkingBudgetTokens: 4000        # `extended` ONLY: any other mode fails at startup. >= 1024, and it
#                                      #   is clamped below the request's max_tokens (4096 by default, so a
#                                      #   larger number is sent as max_tokens - 1 with a WARN). Raising that
#                                      #   ceiling is the agent definition's `model.maxTokens`, not a key here.
#    thinkingDisplay: summarized       # unset by default, and `summarized` is the only value -- ASK for the
#                                      #   model's thinking text and show it live, dimmed, as it is produced.
#                                      #   (The server also accepts `omitted`, its own default; it is not offered
#                                      #   here because it would open the stream and ask for nothing to fill it.)
#                                      #   Two effects from one key, and which one bites depends on the mode:
#                                      #     adaptive  writes thinking.display (without which this model
#                                      #               generation omits the text entirely) AND forwards it
#                                      #     extended  forwards only -- that dialect emits the deltas already
#                                      #               and takes no display field; a WARN says so once
#                                      #     off       nothing reaches it; a WARN says so once
#                                      #   It costs output tokens on every request, including the blocking
#                                      #   ones with nothing to render them, which is why it is opt-in.
#    replayThinkingBlocks: true        # default true. false strips stored thinking blocks from the history
#                                      #   -- the remedy for "Invalid signature in thinking block. The block
#                                      #   is bound to a different conversation."

# OpenAI-only settings. The mirror of the block above and read by the openai provider alone, so writing
# it under `provider: anthropic` fails at startup rather than being ignored. Leave it out and the request
# is byte-for-byte what it was.
#  openai:
#    reasoningSummary: auto            # unset by default. auto | concise | detailed -- ASK for a summary of
#                                      #   the model's reasoning and show it live, dimmed, as it is produced.
#                                      #   On this endpoint the reasoning itself is encrypted_content, so a
#                                      #   summary is the only readable form of it that exists.
#                                      #   Responses API ONLY: a model that does not do the reasoning trace
#                                      #   round trip goes to Chat Completions, which has no such parameter,
#                                      #   and a WARN says so once. Costs output tokens, hence opt-in.

