# Aimon CLI Default Configuration

# LLM Provider Configuration
llm:
  provider: "openai"
  baseUrl: https://api.openai.com/v1
  apiKey: "${OPENAI_KEY}"
  model: "gpt-5.1"
  timeout: 60

# Agent Configuration
agent:
  name: "default"



