# CLI Settings
cli:
#  prompt: "aimon> "
  colorOutput: true
  showIterations: true
  showToolCalls: true  # Display tools calls with parameters
  streaming: true      # PSTREAM-11: stream assistant text token-by-token (disable with --no-streaming)
  enableWorkflow: false  # Opt-in: register the experimental multi-perspective `Workflow` tool
  enableWorkflowJs: false  # Opt-in: register the GraalJS-scripted `WorkflowJs` tool (module aimon-workflow-graaljs)

