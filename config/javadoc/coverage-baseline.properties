# Undocumented public API per published module — the baseline `checkJavadocCoverage` holds each module to.
#
# The count is what `./gradlew javadocCoverage` reports: doclint `missing` warnings over the module's sources outside
# `*.impl`. The check fails if a module's count differs from its line here, in either direction — above means new
# public API without javadoc; below means someone documented something, and the line goes down in the same change.
# A module with no line is held to 0.
#
# The total of this file is the number docs/project/roadmap.md §3 quotes for the 1.0 condition.
