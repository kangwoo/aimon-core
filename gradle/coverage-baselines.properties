# Per-module line-coverage floors. A module may not drop below its number.
#
# This is a BASELINE, not a target: every value is what the module actually measured, frozen so it
# cannot rot downwards. It is the same shape as checkstyle's error budget and
# PackageDependencyArchitectureTest's BASELINE_TOP_LEVEL_CYCLES -- nothing here was chosen as a goal,
# and raising a number is a separate decision from not letting it fall.
#
# Measured on CI (run 33479413524, 2026-09-01, `test` + `integrationTest` merged), which is the only
# place both tiers land in one workspace. Do not re-derive these from a laptop: five of the modules
# below measure 0-28% there unless the docker tier has been run in the same working tree.
#
# `aimon-memory-{file,mongodb,postgres}` used to have entries here. The last two were removed with their
# modules -- the distributed memory backends live in the aimon-memory service now -- and the first was
# folded into `aimon-core`, whose own floor absorbs it.
#
# The value is floor(measured) - 1, and the -1 is not padding for its own sake. The same commit
# measured 81.8% locally and 81.4% on CI for aimon-session-postgres, so coverage here moves by ~0.4pp
# between environments; plain floor(measured) would have left four modules 0.1pp of room and made this
# gate flake. A rule that flakes gets excluded, and an excluded rule is worse than none -- which is the
# reasoning this item was opened with. Headroom is 1.1-2.0pp, comfortably clear of what was observed.
#
# A module with no entry here gets no rule. Adding a module means adding a line.
#
# aimon-browser-playwright used to carry a line here, and the story it recorded is worth one sentence now that
# the module has moved to its own repository: its floor of 82 had been frozen while `playwrightTest` contributed
# nothing at all -- the task was registered without `testClassesDirs`, matched no test class, and reported
# NO-SOURCE -- and re-freezing it at 87 after the tier was wired is what made the number unreachable on the unit
# tier alone, so the tier could not be dropped back out of CI quietly. The floor travelled with the module.
#
# aimon-llm-capability-testkit is the one testkit with a line, because it is the one with tests of its own -- its
# three siblings are main sources only, which is why they have none. It was frozen from a laptop for a specific
# reason rather than a general one: this module has no tier but `test`, so the rule's stated hazard (a docker tier
# absent from `test`) cannot apply to it. Measured 2026-09-10,
# 192/219 lines (87.67%); the 27 missed lines are mostly the abstract JUnit shell, which only the two surface modules
# run. The first CI coverage run that includes the module should agree to the line; if it does not, re-freeze from it.

aimon-bootstrap=85
aimon-cli=62
aimon-core=86
aimon-filesystem-gridfs=83
aimon-filesystem-s3=81
aimon-knowledge-opensearch=31
aimon-llm-anthropic=73
aimon-llm-capability-testkit=86
aimon-llm-openai=67
aimon-rewake-webhook=91
aimon-scheduling-quartz=84
aimon-session-mongodb=74
aimon-session-postgres=80
aimon-session-redis=81
aimon-session-routing=86
