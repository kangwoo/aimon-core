# Advisories. Nothing in this build reads these versions against an advisory database: no CI job runs a dependency
# scanner, Dependabot alerts are off in the repository's settings (2026-09-11), and .github/dependabot.yml proposes
# newer versions without knowing which old ones are affected. So a version inside a published advisory range is found
# by reading. Before choosing or keeping a version, search NVD for the library by name
# (services.nvd.nist.gov/rest/json/cves/2.0?keywordSearch=<name>) and read the project's release notes. Do not stop at
# GitHub's advisory database or OSV: a query by package finds an advisory there only once it is reviewed, and the
# `logback` note below records two CVEs neither returned. If Dependabot alerts and automatic dependency submission are
# turned on, they report reviewed advisories against the resolved graph; this note still covers the rest.

[versions]
# Language
java = "17"

# Frameworks
# Spring Boot baseline the starter compiles against (spring-boot-starter-design.md D6): the 4.1 line, which
# brings Spring Framework 7.0.x. D6 previously fixed this at 3.5 for the support window — 3.5 is the last of
# Boot 3 and is commercially supported to 2032-06, against 2028-07 for 4.1 — and that trade was taken
# deliberately in the other direction: see D6 for what was given up and why.
#
# Boot 4 keeps the Java 17 baseline (spring-boot-4.1.1's SpringApplication.class is major version 61,
# measured), so this ref moved without `java` above moving with it.
#
# The same ref pins spring-boot-starter-test, which every module gets from aimon.java-conventions,
# and the Boot Gradle plugin in [plugins] — one ref, so a version bump is provably one edit. There was
# a second pair of keys (spring-boot-plugin / dependency-management-plugin) holding the same two values
# for the plugins alone; it was collapsed because nothing kept the two halves in step. If you ever need
# the plugin to lead or trail the library BOM, split the ref back out deliberately rather than by drift.
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"

# Libraries
lombok = "1.18.48"
mapstruct = "1.6.3"

# Database
postgresql = "42.7.13"
h2 = "2.5.250"
hikari = "7.1.0"
mongodb = "5.11.1"

# Cloud & Storage
aws-sdk = "2.54.16"

# Testing
# Test classpaths against shipped versions (#99). #91's bar: a module's tests run against the versions the module
# ships, unless the difference is a recorded choice. Compared on every module (runtimeClasspath against
# testRuntimeClasspath, 2026-09-11), the differences come from four sources. This block decides three of them, per
# source; the fourth, JUnit on aimon-memory-testkit, is about the number below and is answered at the end of its note.
#
# - spring-boot-starter-test, which aimon.java-conventions gives every module's tests: ALIGNED on aimon-cli, whose
#   runtimeClasspath is its distribution. It raised jakarta.xml.bind-api (4.0.4 -> 4.0.5) there and, until `logback`
#   below moved past it (#114), logback-classic and logback-core (1.5.13 -> 1.5.34); aimon-cli/build.gradle.kts
#   resolves both test classpaths consistently with runtimeClasspath, and says why. NOT DECIDED on two other modules,
#   where the same source raises jakarta.xml.bind-api (4.0.4 -> 4.0.5) on aimon-scheduling-quartz and
#   jakarta.annotation-api (1.3.5 -> 2.1.1) on aimon-knowledge-opensearch: backlog D-2,
#   docs/backlog/module-dependency-scope.md. It raised the Logback pair on aimon-session-testkit as well, until #114.
# - Testcontainers (duct-tape): ACCEPTED. org.jetbrains:annotations 13.0 shipped (kotlin-stdlib, via okhttp), 17.0.0
#   under test, on aimon-spring-boot-starter, aimon-filesystem-gridfs, aimon-filesystem-s3 and
#   aimon-session-{mongodb,postgres,redis}. Both jars are CLASS-retention annotations and constant holders — nothing a
#   test run loads — and no source here names them. Aligning would push Testcontainers below the version it asks for
#   on six docker tiers to equalise a number nothing observes.
# - The provider SDKs on aimon-spring-boot-starter's test classpath: ACCEPTED. error_prone_annotations 2.21.1 shipped
#   (Caffeine, via aimon-session-routing), 2.33.0 under test (anthropic-java and openai-java both ask for it). An
#   annotations jar no source here names; and the starter keeps both SDKs compileOnly so the application adds one,
#   which then resolves 2.33.0 itself — the test classpath is that application's.
#
# JUnit carries no version on a module that only tests against it, on purpose: such a module gets
# spring-boot-starter-test (aimon.java-conventions), which brings org.junit:junit-bom onto its *test*
# configurations, and a number written here would be a dead letter reading like the truth.
#
# The four testkits are not such modules, and this note is the one place their platform is explained.
# aimon-filesystem-testkit, aimon-session-testkit, aimon-llm-capability-testkit and aimon-memory-testkit
# compile against JUnit in *main* sources, which the test-scoped starter never reaches, and name
# `junit-jupiter` without a version — so each declares a platform itself, and declares it `api`, which puts
# that platform on every consumer's classpath as well. Which platform is therefore a decision about the
# consumer, and all four make the same one: `platform(libs.junit.bom)`.
#
# `spring-boot-dependencies` would govern that one coordinate by handing the consumer Spring Boot's whole
# dependency management (~1,400 coordinates), and a platform constraint raises any version it names that the
# consumer resolves lower. Published, that cost leaves the build — sixteen coordinates moved for a consumer
# on Boot 3.4.0, which is why aimon-memory-testkit switched first. Unpublished, it stays inside the build,
# where nothing shows it: the other three took Spring Boot's platform until #91, and it had moved twenty-one
# artifacts on six of their seven consumers to a version the consumer does not ship (measured 2026-09-10) —
# among them HikariCP 6.3.3 against the 5.1.0 aimon-cli and aimon-session-postgres ship, and the MongoDB
# driver 5.5.2 against the 4.11.1 aimon-filesystem-gridfs and aimon-session-mongodb ship. Twenty of those
# differences went away with it; the twenty-first, the starter's error_prone_annotations, fell from 2.49.0 to
# the 2.33.0 its provider SDKs ask for, and still differs (recounted for #99; the block above records it).
# junit-bom costs the consumer JUnit's coordinates, which is what a JUnit contract suite may fairly ask for.
#
# So the number below is not necessarily the version a given module's tests run on: whatever newer JUnit the
# other test libraries on a classpath ask for wins by conflict resolution. On Boot 4.1.1 every module resolves
# JUnit 6 — 6.1.3 where a testkit's platform reaches, 6.0.3 from spring-boot-starter-test everywhere else
# (measured across all 23 projects, 2026-09-21). It is the floor the testkits set, and the constraint
# aimon-memory-testkit publishes. Keep it at or above the JUnit that
# `spring-boot` above resolves to (Boot 4.1.1 manages 6.0.3; this entry is 6.1.3, checked 2026-09-21).
# Ahead is the safe direction, because this platform is `api` on four testkits and so raises a consumer's
# JUnit rather than being raised by it; behind, Spring Boot's newer JUnit wins by normal conflict
# resolution and the number here becomes a floor nothing observes.
#
# The instruction here used to read "keep it equal ... (today 5.12.2)", and by 2026-09-16 the line below
# said 6.1.3 — Dependabot #161 had moved the value while the sentence above it stayed. That is how **11 of
# this build's projects already resolved JUnit 6.1.3 while still on Boot 3.5**: the four testkits, which
# declare the platform, and the seven modules that take one on `testImplementation` and therefore inherit it
# through `api` — aimon-core, aimon-cli, aimon-spring-boot-starter, aimon-filesystem-gridfs and
# aimon-session-{mongodb,postgres,redis}. Everything else stayed on 5.13.4 or 5.14.4. Measured by pinning
# `spring-boot` back to 3.5.16 and reading dependencyInsight on each (2026-09-21), not inferred.
# "Resolved" rather than "ran", and the two numbers differ: **11 projects resolve it, 8 run tests on it** —
# the seven consumers plus aimon-llm-capability-testkit, the only testkit with test sources of its own
# (measured: the other three have 0). For those three the platform is what their *main* sources compile
# against and what they publish, which is the whole point of declaring it `api`; no test executes there.
#
# The Boot 4 move finished what that bump started. spring-boot-starter-test 4.1.1 asks for 6.0.3, so the
# modules the testkit platform does not reach moved off JUnit 5 too: every project in this build now resolves
# JUnit 6, 6.1.3 or 6.0.3 (measured across all 23, 2026-09-21). Nothing here is on JUnit 5 any more.
#
# That is also why the Boot 4 move (D6) did not have to pay for a JUnit 6 jump: it was already paid, and
# paid unevenly, which is the part worth noticing — half the build had moved and no sentence said so.
# "At or above" is stated as a range for that reason — an exact equality is a sentence the next bot
# invalidates.
# For aimon-memory-testkit that floor is the answer rather than a lag (#99). The suite compiles against, and
# publishes, whatever this entry says — junit-bom as a platform in the module metadata, an import in the POM —
# and that is the lowest JUnit it links against. Today that is 6.1.3, so the floor it publishes is 6.1.3.
#
# The paragraph here used to read "compiles against 5.12.2 … aimon-core's tests run it on 5.14.4 … its own
# testRuntimeClasspath resolves 5.13.4", and every one of those three numbers was stale: the entry below moved
# to 6.1.3 (Dependabot #161) and the sentence did not follow, exactly like the instruction above it. Re-measured
# 2026-09-21 on Boot 4.1.1: `:aimon-core:dependencyInsight --configuration testRuntimeClasspath` reports
# junit-jupiter-api **6.1.3**, "by conflict resolution: between versions 6.1.3, 6.0.3 and 5.13.4" — 6.0.3 being
# what spring-boot-starter-test 4.1.1 asks for. The old prose described a build that no longer exists.
#
# The consequence the old paragraph reasoned about is the one to keep: raising the published floor moves a
# consumer's JUnit, so it is a decision about consumers rather than about this build. What changed is that the
# floor is no longer below what the build runs — it is the thing setting it.
#
# There was a one-off verification recorded here (#120, 2026-09-11): aimon-core's StoreBackedPeerMemoryContractTest,
# the suite's one in-tree subclass, pinned to exactly the then-floor with an init script adding
# `testRuntimeOnly(enforcedPlatform(...))` — 21 tests, 0 failed, 0 skipped. Nothing in the build repeats it.
# **It has not been repeated since the floor moved to 6.1.3**, and its own instruction said to repeat it when
# this number or the suite changes. That is an outstanding item, recorded here rather than quietly dropped.
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.23.0"
testcontainers = "1.21.4"
archunit = "1.5.0"

# Observability
micrometer = "1.17.1"
opentelemetry = "1.34.1"

# Scheduling
quartz = "2.5.2"

# Caching
caffeine = "3.2.4"

# Redis
lettuce = "7.7.0.RELEASE"

# Utilities
guava = "33.7.1-jre"
commons-lang3 = "3.20.0"
jackson = "2.22.2"
snakeyaml = "2.7"
cron-utils = "9.2.1"
mustache = "0.9.14"
picocli = "4.7.7"
jline = "3.24.1"
jansi = "2.4.3"

# HTML Parsing
jsoup = "1.23.2"

# HTTP & Networking
okhttp = "5.5.0"
javalin = "7.2.3"

# AI & LLM
openai = "4.63.1"
anthropic = "2.62.0"
jtokkit = "1.1.0"

# GraalJS (Phase 5 workflow frontend). JDK-17 line: 23.0.x is the last GraalVM-for-JDK-17
# release train (23.1+ requires JDK 21). Upgrade seam: on a JDK-21 baseline, bump to 24.x and swap
# graal-sdk -> org.graalvm.polyglot:polyglot, js -> org.graalvm.polyglot:js-community@pom.
graaljs = "25.3.4.1"

# Search
opensearch = "2.20.0"
opensearch-rest-client = "2.18.0"

# Logging
slf4j = "2.0.19"
# The Logback aimon-cli ships, and the Logback the unpublished aimon-sample-app packs, whose build script sets Spring
# Boot's `logback.version` from this entry (#129); every other module names it at test scope, or, for the unpublished
# aimon-session-testkit, on a classpath that only ever joins a consumer's tests. 1.6.3 (#114), the one release past
# every Logback CVE NVD lists on 2026-09-11. No 1.5.x is: CVE-2026-19880 (logback-classic up to 1.6.2, a path traversal
# through SiftingAppender's MDC discriminator) is fixed only in 1.6.3, and CVE-2026-13006 (logback-core up to 1.5.36)
# circumvents the 1.5.19 fix for CVE-2025-11226, the advisory #114 was filed for. None of the three is reachable from
# this build today — no Janino on any classpath, no SiftingAppender in the bundled logback.xml, no MDC in any source
# (measured) — but a dependency or a user's own logback.xml can change each of those without touching this line, so
# that was not a reason to stay. GitHub's advisory database holds the two newest only as unreviewed advisories that
# name no package (GHSA-567r-vvh5-jjr8, GHSA-9mh8-hq67-v26g), so a query by package returns neither, and OSV has no
# record of either (2026-09-11): look for the next one in NVD and on logback.qos.ch/news.html, not only by id.
# 1.6.x is Logback's stable line and 1.5.x its legacy one. Spring Boot manages 1.5.x (4.1.1 resolves 1.5.38), so this
# entry is ahead of `spring-boot` and wins on every test classpath that names it, and replaces Boot's version in
# aimon-sample-app. Keep it at or above Boot's: below it, spring-boot-starter-test raises this entry there, and
# aimon-session-testkit's shipped and tested versions part again (backlog D-2); below it, aimon-sample-app would pack
# an older Logback than Boot manages. logback-classic 1.6.3 builds against slf4j 2.0.18, the version above;
# logback-core follows logback-classic.
logback = "1.6.3"

# Code quality tools
checkstyle = "10.12.5"
spotbugs = "6.5.11"
jacoco = "0.8.11"
spotless = "6.25.0"

# Publishing
# 0.32.0 rather than 0.30.0 because 0.30.0 refuses to publish a snapshot at all when the host is the Central
# Portal — `SonatypeRepositoryBuildService.publishingUrl()` had a bare `require(!host.isCentralPortal)` with the
# message "Snapshots are not supported when publishing through the central portal". That is a client-side check,
# so enabling snapshots on the Portal account does nothing for it; the version is the only lever. 0.32.0 replaced
# the refusal with the Portal's own snapshot path (`<root>/repository/maven-snapshots/`).
#
# The smallest version that has it, deliberately. Releases go through this same plugin, and 0.2.4 shipped on
# 0.30.0, so the release path moves as little as possible while the snapshot path starts working.
maven-publish = "0.32.0"

[libraries]
# Spring Boot
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
# Starter authoring: the autoconfigure jar plus the two annotation processors that generate
# spring-configuration-metadata.json (IDE completion) and the AutoConfiguration condition index.
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor", version.ref = "spring-boot" }
# Named only by aimon-spring-boot-starter's tests, for one constant: WebServerGracefulShutdownLifecycle's
# SMART_LIFECYCLE_PHASE, which AimonLifecycleTest orders AIMON's own phase against. Boot 3 carried that class in
# the core `spring-boot` jar, which every test classpath already had; Boot 4's modularisation moved it to
# org.springframework.boot.web.server.context in this artifact, so it has to be asked for by name. Not
# spring-boot-starter-web, which would put a servlet container on the classpath of a slice test that starts no
# web server.
spring-boot-web-server = { module = "org.springframework.boot:spring-boot-web-server", version.ref = "spring-boot" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mongodb-driver = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }

# Cloud & Storage
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }

# Annotations
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }

# Code Generation
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
# Declared for the four testkits — the modules that compile against JUnit on a *main* source set (the `junit`
# note above says why this and not `spring-boot-dependencies`). Every other module gets JUnit through
# spring-boot-starter-test and must not use this.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-mongodb = { module = "org.testcontainers:mongodb", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-localstack = { module = "org.testcontainers:localstack", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Observability
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Utilities
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
# Jackson 3, carrying no version on purpose — the same shape as `junit-jupiter` above and for the same reason.
# Its one consumer is aimon-sample-app, which applies Boot's dependency management, so Boot's jackson-bom (3.1.5
# on 4.1.1) decides the version; a number here would be a second opinion nothing reconciles. The `jackson` ref
# above is Jackson 2 and stays — that is what aimon-core ships, and the two majors coexist by package name.
jackson3-databind = { module = "tools.jackson.core:jackson-databind" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
mustache-java = { module = "com.github.spullara.mustache.java:compiler", version.ref = "mustache" }
cron-utils = { module = "com.cronutils:cron-utils", version.ref = "cron-utils" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
jline = { module = "org.jline:jline", version.ref = "jline" }
jansi = { module = "org.fusesource.jansi:jansi", version.ref = "jansi" }

# Scheduling
quartz = { module = "org.quartz-scheduler:quartz", version.ref = "quartz" }

# Caching
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Redis
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# HTTP & Networking
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }

# HTML Parsing
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# AI & LLM
openai-client = { module = "com.openai:openai-java", version.ref = "openai" }
anthropic-client = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }

# GraalJS (JDK-17 line): Polyglot embedding API (graal-sdk) + JS language (brings truffle-api)
graaljs-polyglot = { module = "org.graalvm.sdk:graal-sdk", version.ref = "graaljs" }
graaljs-js = { module = "org.graalvm.js:js", version.ref = "graaljs" }

# Search
opensearch-client = { module = "org.opensearch.client:opensearch-java", version.ref = "opensearch" }
opensearch-rest-client = { module = "org.opensearch.client:opensearch-rest-client", version.ref = "opensearch-rest-client" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[bundles]
spring-boot-web = ["spring-boot-starter-web", "spring-boot-starter-validation"]
spring-boot-data = ["spring-boot-starter-data-jpa", "hikari"]
testing = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit-jupiter"]
jackson = ["jackson-databind", "jackson-datatype-jsr310"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
