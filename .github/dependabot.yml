# Dependency updates.
#
# Three ecosystems, all anchored at the repository root: Gradle resolves the version catalog at
# `gradle/libs.versions.toml` plus every module's build file from there, GitHub Actions reads
# `.github/workflows/`, and pip reads `docs-requirements.txt` — the pins the docs site builds
# with. Updates are grouped so a quiet week produces a handful of reviewable PRs
# instead of thirty — on a build whose single gate is `./gradlew checkAll`, one grouped PR that runs
# the gate once is worth more than ten that each run it separately.
#
# Every Gradle coordinate below appears in `gradle/libs.versions.toml`. Keep it that way: a pattern that
# matches nothing is invisible, and the group it belongs to silently stops grouping.
#
# Version updates only. Nothing here reports a version that sits inside an advisory range: Dependabot
# proposes newer versions without knowing which old ones are affected, and Dependabot alerts are a
# repository setting that is off (2026-09-11). The note at the top of `gradle/libs.versions.toml` says
# how an affected version is found.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    # Not a throttle — the grouping below decides how many PRs a week brings. Dependabot opens at most
    # this many version-update PRs at a time, grouped ones included, and drops every other update it
    # computed without saying so: the job log still shows a `create_pull_request` call for each, and the
    # PR never appears. At 5, the three Gradle runs to 2026-09-07 made 29, 24 and 24 such calls and
    # opened five PRs each, so a Logback release fixing two CVEs was computed three times and shown none
    # (#129). 50 is a bound above the worst case on today's catalog, not an expected count: every version
    # ref and the wrapper behind at once, each as its own PR, plus the three groups — 49 on 2026-09-11,
    # when the largest run measured had submitted 29. If the catalog outgrows it, raise it: past the
    # limit, updates are dropped again, and the only sign is a job log with more calls than new PRs.
    open-pull-requests-limit: 50
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      # Test-only dependencies are the safest to take in bulk: a break shows up as a red build,
      # never as a runtime surprise for a downstream user.
      test-dependencies:
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
          - "org.assertj:*"
          - "org.mockito:*"
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"
        update-types:
          - minor
          - patch
      # Storage and search backends. Grouped because their versions tend to land as a set, and
      # because each one is covered by the same Testcontainers suite.
      storage-clients:
        patterns:
          - "org.mongodb:*"
          - "software.amazon.awssdk:*"
          - "io.lettuce:*"
          - "org.postgresql:*"
          - "org.opensearch.client:*"
          - "com.zaxxer:HikariCP"
          - "com.h2database:*"
        update-types:
          - minor
          - patch
      # Everything else, patch level only. Minors and majors on production dependencies arrive as
      # individual PRs so somebody reads the changelog before the merge — that matters most for the
      # LLM SDKs (`com.openai:openai-java`, `com.anthropic:anthropic-java`), which move fast and
      # carry wire-format changes.
      production-patches:
        patterns:
          - "*"
        exclude-patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
          - "org.assertj:*"
          - "org.mockito:*"
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"
          - "org.mongodb:*"
          - "software.amazon.awssdk:*"
          - "io.lettuce:*"
          - "org.postgresql:*"
          - "org.opensearch.client:*"
          - "com.zaxxer:HikariCP"
          - "com.h2database:*"
        update-types:
          - patch

    # Boot majors do not arrive here. `docs/design/integration/spring-boot-starter.md` D6 fixes the
    # baseline the starter compiles against at the 4.1 line, and a major is not a version bump but a
    # decision about which Boot generation the one published artifact serves — D6 rules out one artifact
    # serving two, so there is no version here that would satisfy both and no bot that can pick.
    #
    # This rule outlived the reasoning it was written for, which is worth knowing before trusting it
    # again. It was added when D6 pinned 3.5 for the support window (3.5 is supported to 2032-06-30,
    # where 4.1 ends 2028-07-31), and "do not take a major" then meant "do not leave Boot 3". D6 has
    # since taken that major deliberately, giving up roughly four years of consumer support window for
    # what the design document lists. The rule stayed because the *other* half of its reasoning — a
    # major is a human decision — survived the reversal intact. Do not read it as the support-window
    # argument still being in force; that argument lost.
    #
    # Majors only. 4.1.x patches still arrive grouped, and 4.x minors arrive as individual PRs under the
    # rule above, which is where they belong: Boot 4's modularisation is still moving classes between
    # artifacts (4.x split health, metrics and the web server types out of the jars that held them in
    # Boot 3), so a minor here deserves the changelog read that an individual PR forces.
    #
    # The catalog collapses the libraries and the Gradle plugin onto a single `spring-boot` ref and both
    # resolve under the same group id, so one pattern covers the pair.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # The MkDocs toolchain (`docs-requirements.txt`) is pinned exactly so the Pages build is
  # reproducible — which also means a security fix in mkdocs-material or a transitive
  # jinja2/markdown release never arrives unless something opens the PR. This is that something.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-site:
        patterns:
          - "*"
