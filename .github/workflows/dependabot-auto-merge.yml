# Turns on GitHub's auto-merge for the Dependabot pull requests this repository has already
# decided are safe to take without a human reading the changelog. Auto-merge is a *request*:
# GitHub still holds the PR until the `main` ruleset is satisfied, so every one of the five
# required checks (docs-links, translations, build, integration, coverage) has to be green
# before anything lands. This workflow never merges anything itself.
#
# The eligibility rule is not invented here — it is `.github/dependabot.yml`'s own policy read
# back out. That file groups the updates it considers bulk-safe (`test-dependencies`,
# `storage-clients` at minor and patch; `production-patches` at patch) and says of the rest:
# "Minors and majors on production dependencies arrive as individual PRs so somebody reads the
# changelog before the merge". So: a *grouped* PR at minor or patch merges itself; an
# *ungrouped* one is by construction the case that comment reserved for a person.
#
# Two guards rather than one. Belonging to a group is the policy signal, but the `actions` group
# carries no `update-types` filter and would otherwise let an action major through, so the
# semver check is asserted separately instead of being inferred from the grouping.
name: dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get a read-only GITHUB_TOKEN unless the workflow asks otherwise,
# and enabling auto-merge is a write to the pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actor` establishes that Dependabot triggered this run (and so that the token is the
    # restricted one); `user.login` establishes that the PR itself is Dependabot's. Neither
    # implies the other, and the pair is what the job's safety rests on.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # pip is deliberately absent. The check that would catch a broken docs toolchain is
      # `docs site`, and that one is *not* in the ruleset's required list — it is path-filtered,
      # so a PR touching no documentation never produces it and requiring it would strand such a
      # PR forever. Auto-merge waits only on required checks, so a docs-requirements.txt bump
      # would land without the one check that can judge it. Those PRs stay manual until that gap
      # is closed rather than pretending a gate exists.
      - name: Enable auto-merge
        id: enable
        if: >-
          contains(fromJSON('["gradle", "github_actions"]'), steps.metadata.outputs.package-ecosystem)
          && steps.metadata.outputs.dependency-group != ''
          && contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        # Squash rather than merge: a bump is a single-purpose change, and dependabot.yml already
        # shapes its subject line (`commit-message.prefix` + `include: scope`) into one that reads
        # correctly on its own. A merge commit here would add a node carrying no information.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why a PR was left alone
        if: steps.metadata.outputs.update-type != '' && steps.enable.outcome == 'skipped'
        run: |
          echo "Left for review — ecosystem=${{ steps.metadata.outputs.package-ecosystem }}," \
               "group='${{ steps.metadata.outputs.dependency-group }}'," \
               "update-type=${{ steps.metadata.outputs.update-type }}" >> "$GITHUB_STEP_SUMMARY"
