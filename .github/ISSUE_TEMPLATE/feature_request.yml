name: Feature request
description: Propose a capability or an extension point AIMON does not have yet
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: the [feature catalog](https://github.com/kangwoo/aimon-core/blob/main/docs/overview/features.md)
        lists what already exists, and [`docs/backlog/`](https://github.com/kangwoo/aimon-core/tree/main/docs/backlog)
        tracks items already known to be open.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are stuck in, not the solution you have in mind.
        This is the part that determines whether the feature gets built.
      placeholder: |
        I need agents to resume a session after a node restart, but ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What you would like AIMON to do. If it touches a public interface, sketch
        the signature.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: >
        Workarounds you attempted, and why they were not enough. Existing extension
        points (`Tool`, `Hook`, `LlmClient`, `VirtualFileSystem`, `SessionRecordStore`, …)
        may already cover this — tell us if you ruled one out and why.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Agent execution / ReAct loop
        - Tools
        - Skills
        - Hooks
        - Subagents / workflows
        - Sessions & persistence
        - Memory
        - Knowledge / RAG
        - LLM providers
        - Filesystem
        - Sandbox
        - Scheduling
        - Observability
        - Build / packaging
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this
          required: false
