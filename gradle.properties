# Publish MD5 and SHA1 checksums only, not SHA256 and SHA512 as well.
#
# Since Gradle 6 the default is all four, but Central requires only the first two, and the extra pair is
# written for *every* file in the bundle — including each `.asc`. With 21 published modules — twenty
# libraries at 50 files each with all four checksums and 30 with two, plus the platform at 20 and 12 —
# that is the difference between 1,020 and 612 files per release, which is the number Sonatype's Usage
# Center counts:
# https://central.sonatype.org/publish/reducing-publishing-usage/
#
# "insecure" names the weaker checksums, not a weaker artifact: what proves the artifact is the detached
# GPG signature next to it, and that is unaffected. The property is internal to Gradle (no public API
# exists for this) and is read at publication time — verified against Gradle 9.2.1.
systemProp.org.gradle.internal.publish.checksums.insecure=true
